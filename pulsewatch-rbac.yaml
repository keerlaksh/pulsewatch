apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulsewatch-api
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulsewatch-api-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulsewatch-api-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: pulsewatch-api
    namespace: default
roleRef:
  kind: Role
  name: pulsewatch-api-reader
  apiGroup: rbac.authorization.k8s.io
docker build -f .\backend\Dockerfile -t keerlaksh/pulsewatch:latest .
docker push keerlaksh/pulsewatch:latest