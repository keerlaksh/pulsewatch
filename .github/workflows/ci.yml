name: PulseWatch CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: pulsewatch
          POSTGRES_PASSWORD: pulsewatch
          POSTGRES_DB: pulsewatch

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U pulsewatch -d pulsewatch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: pulsewatch
      DB_USER: pulsewatch
      DB_PASSWORD: pulsewatch


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Initialize database
        run: |
          PGPASSWORD=pulsewatch psql \
            -h localhost \
            -U pulsewatch \
            -d pulsewatch \
            -c "
            CREATE TABLE IF NOT EXISTS request_metrics (
                id SERIAL PRIMARY KEY,
                timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                endpoint VARCHAR(255),
                status_code INTEGER,
                latency DOUBLE PRECISION
            );
            "


      - name: Run tests
        working-directory: backend
        run: |
          pytest


  docker:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build \
            -t keerlaksh/pulsewatch:latest \
            ./backend


      - name: Push Docker image
        run: |
          docker push keerlaksh/pulsewatch:latest